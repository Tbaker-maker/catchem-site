# Pace ?prewarm=html across every product after public-data publish (or by hand).
# One job is killed at 6 hours and the catalog never finishes, so each batch
# is its own job: well under that cap, one request at a time, resume from the warm list.
name: Prewarm product HTML
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "all | sealed | single"
        default: all
        type: string
      sleep_ms:
        description: "Gap between cold requests (ms)"
        default: "1200"
        type: string
      limit:
        description: "Max ids (0 = all)"
        default: "0"
        type: string
      fresh:
        description: "true drops the warm list and requests every page again"
        default: "false"
        type: string
      max_batches:
        description: "Max batches this run (0 = every batch that still has work, cap 240)"
        default: "0"
        type: string
  repository_dispatch:
    types: [prewarm-products]

concurrency:
  group: prewarm-product-html
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      batches: ${{ steps.plan.outputs.batches }}
      batch_size: ${{ steps.plan.outputs.batch_size }}
      sleep_ms: ${{ steps.plan.outputs.sleep_ms }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore warm ids
        if: github.event.inputs.fresh != 'true' && github.event.client_payload.fresh != 'true' && github.event.client_payload.fresh != true
        uses: actions/cache/restore@v4
        with:
          path: prewarm-state/warm.json
          key: prewarm-html-warm-${{ github.run_id }}
          restore-keys: |
            prewarm-html-warm-
      - name: Plan batches
        id: plan
        env:
          PREWARM_KIND: ${{ github.event.inputs.kind || github.event.client_payload.kind || 'all' }}
          PREWARM_SLEEP: ${{ github.event.inputs.sleep_ms || github.event.client_payload.sleep_ms || '1200' }}
          PREWARM_LIMIT: ${{ github.event.inputs.limit || github.event.client_payload.limit || '0' }}
          PREWARM_FRESH: ${{ github.event.inputs.fresh || github.event.client_payload.fresh || 'false' }}
          PREWARM_MAX_BATCHES: ${{ github.event.inputs.max_batches || github.event.client_payload.max_batches || '0' }}
        run: node scripts/prewarm-product-pages.mjs --plan --out prewarm-state --state prewarm-state/warm.json
      - uses: actions/upload-artifact@v4
        with:
          name: prewarm-plan
          path: prewarm-state

  warm:
    needs: plan
    if: needs.plan.outputs.batches != '[]' && needs.plan.outputs.batches != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: ${{ fromJson(needs.plan.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: prewarm-plan
          path: prewarm-state
      - name: Warm one batch
        env:
          CATCHEM_ORIGIN: https://catchemtcg.com
          PREWARM_SLEEP: ${{ needs.plan.outputs.sleep_ms }}
        run: node scripts/prewarm-product-pages.mjs --batch ${{ matrix.batch }} --batch-size ${{ needs.plan.outputs.batch_size }} --ids prewarm-state/ids.json --state prewarm-state/warm.json --report prewarm-state/batch-${{ matrix.batch }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prewarm-batch-${{ matrix.batch }}
          path: prewarm-state/batch-${{ matrix.batch }}.json
          if-no-files-found: warn

  join:
    needs: [plan, warm]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: prewarm-plan
          path: prewarm-state
      - name: Download batch reports
        id: reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: prewarm-batch-*
          path: prewarm-state/reports
          merge-multiple: true
      - name: Merge warm ids and print batch runtimes
        run: node scripts/prewarm-product-pages.mjs --join prewarm-state --reports prewarm-state/reports
      - name: Save warm ids for the next run
        if: hashFiles('prewarm-state/warm.json') != ''
        uses: actions/cache/save@v4
        with:
          path: prewarm-state/warm.json
          key: prewarm-html-warm-${{ github.run_id }}
